<style>
:root{
  --bg:#080d13;--panel:#111923;--panel2:#182231;--panel3:#0d151f;
  --line:#263548;--text:#f3f7fb;--muted:#8fa1b5;
  --accent:#5fa8ff;--accent2:#8bc4ff;--good:#39cf86;--bad:#ff687c;--warn:#f3c45b;--violet:#9d8cff;
  --radius:18px;--shadow:0 16px 45px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 12% -8%,rgba(70,125,190,.18),transparent 36%),
    radial-gradient(circle at 92% 4%,rgba(105,80,190,.11),transparent 30%),
    linear-gradient(145deg,#080d13,#0b121b 58%,#080d13);
  color:var(--text);
  font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:20px}

/* top */
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.brandmark{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#5fa8ff,#8b7cff);
  display:grid;place-items:center;font-weight:900;
  box-shadow:0 8px 28px rgba(95,168,255,.25);
}
.brand h1{margin:0;font-size:22px;letter-spacing:-.3px}
.brand small{color:var(--muted)}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:rgba(17,25,35,.9);color:var(--text);
  padding:9px 12px;border-radius:11px;
  transition:.18s transform,.18s background,.18s border,.18s opacity;
}
.btn:hover{background:var(--panel2);border-color:#38506d;transform:translateY(-1px)}
.btn.primary{
  border-color:#3979c9;background:linear-gradient(180deg,#1a3c68,#143056);
  box-shadow:0 8px 24px rgba(35,100,170,.16);
}
.btn.danger{border-color:#63303a;background:#29151a}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* tabs */
.tabs{
  display:flex;gap:3px;overflow:auto;border:1px solid var(--line);
  background:rgba(12,18,26,.72);padding:4px;border-radius:14px;
  margin-bottom:14px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(14px);
  -webkit-overflow-scrolling:touch;
}
.tab{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px;white-space:nowrap}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.active{color:#fff;background:#1a2d43;box-shadow:inset 0 0 0 1px #2e4967}

/* cards / grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.card{
  background:linear-gradient(180deg,rgba(18,26,37,.94),rgba(14,21,30,.94));
  border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);
  transition:border-color .18s;
}
.card:hover{border-color:#30455d}
.label{color:var(--muted);font-size:12px}
.big{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.subtle{font-size:12px;color:var(--muted)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.input,.select,.textarea{
  background:#0b121a;border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:9px 10px;outline:none;
}
.input:focus,.select:focus,.textarea:focus{border-color:#4b82b8;box-shadow:0 0 0 3px rgba(95,168,255,.10)}
.input{min-width:170px}.select{min-width:120px}
.textarea{width:100%;min-height:72px;resize:vertical}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:rgba(9,14,20,.45);-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;min-width:900px}
.table th,.table td{padding:11px 12px;border-bottom:1px solid rgba(38,53,72,.72);text-align:left;white-space:nowrap}
.table th{
  font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
  background:#0d151f;position:sticky;top:0;z-index:1;
}
.table tr:hover td{background:rgba(95,168,255,.035)}
.table tr:last-child td{border-bottom:0}

.pill{
  display:inline-block;border:1px solid var(--line);background:#101923;
  border-radius:99px;padding:3px 8px;font-size:11px;
}
.two{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.section{margin-top:12px}

/* chart */
.chart-wrap{position:relative}
.chart{height:320px;height:320px;width:100%;display:block;cursor:crosshair}
.chart-tip{
  position:absolute;pointer-events:none;display:none;
  background:rgba(12,18,26,.95);border:1px solid #35506c;border-radius:10px;
  padding:8px 11px;font-size:12px;box-shadow:var(--shadow);z-index:3;min-width:140px;
}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;flex-wrap:wrap;margin-top:8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:18px;height:3px;border-radius:2px;background:#5fa8ff}
.lg-dash{width:18px;height:0;border-top:2px dashed rgba(145,160,178,.7)}
.lg-div{width:18px;height:3px;border-radius:2px;background:#3dd68c}
.lg-dep{width:18px;height:0;border-top:2px dashed #f0b429}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30;backdrop-filter:blur(5px)}
.modalbox{
  width:min(650px,100%);max-height:92vh;overflow:auto;background:#111923;
  border:1px solid #304258;border-radius:20px;padding:19px;box-shadow:0 25px 80px rgba(0,0,0,.55);
}
.modalbox h3{margin:0 0 12px}
.form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;flex-wrap:wrap}
.close{float:right;border:0;background:none;color:var(--muted);font-size:20px;line-height:1}

.notice{
  padding:11px 13px;border:1px solid #263c57;
  background:linear-gradient(90deg,#0f1d2d,#101925);
  border-radius:13px;color:#bfd0e4;margin-bottom:12px;
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;
}
.empty{text-align:center;padding:34px;color:var(--muted)}

/* allocation */
.allocation{display:grid;gap:9px}
.allocrow{display:grid;grid-template-columns:88px 1fr 62px 50px;align-items:center;gap:7px;font-size:13px}
.bar{height:8px;border-radius:99px;background:#202a36;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.bar .tgt{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--warn);opacity:.9}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:12px}
.heroMain{
  padding:20px;
  background:linear-gradient(135deg,rgba(22,46,72,.96),rgba(17,25,35,.96));
  border:1px solid #2c4a69;border-radius:20px;box-shadow:var(--shadow);
}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8db9e7}
.heroValue{font-size:36px;font-weight:850;letter-spacing:-1.2px;margin:6px 0 10px}
.heroMeta{display:flex;gap:8px;flex-wrap:wrap}
.metric{padding:8px 11px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:11px}
.metric b{display:block;font-size:15px;margin-top:2px}

.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{height:10px;background:#202a36;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8e7cff);border-radius:99px}
.analyticsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rankrow{display:grid;grid-template-columns:90px 1fr 70px;gap:9px;align-items:center;margin:9px 0}
.rankbar{height:8px;background:#202a36;border-radius:99px;overflow:hidden}
.rankbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet))}
.statusline{display:flex;justify-content:space-between;gap:10px;align-items:center}

.spinner{
  display:inline-block;width:13px;height:13px;border:2px solid var(--muted);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:-2px;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.movers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mover-list{display:grid;gap:6px}
.mover-item{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid transparent}
.mover-item.up{border-color:rgba(57,207,134,.25)}
.mover-item.down{border-color:rgba(255,104,124,.25)}

.chk{display:flex;align-items:center;gap:8px}
.chk input{width:15px;height:15px}

@media(max-width:1100px){
  .grid{grid-template-columns:1fr 1fr}
  .hero,.two{grid-template-columns:1fr}
  .analyticsGrid{grid-template-columns:1fr 1fr}
  .movers{grid-template-columns:1fr}
}
@media(max-width:620px){
  .app{padding:10px}
  .brand h1{font-size:18px}
  .brandmark{width:36px;height:36px}
  .actions{width:100%}
  .actions .btn{flex:1;min-width:0;padding:9px 8px;font-size:13px}
  .tabs{top:4px}
  .grid,.miniGrid,.analyticsGrid{grid-template-columns:1fr 1fr}
  .big{font-size:18px}
  .heroValue{font-size:28px}
  .row{grid-template-columns:1fr}
  .allocrow{grid-template-columns:72px 1fr 54px 44px}
  .table{min-width:780px}
}

/* ===== MOBILE APP SHELL ===== */

/* tabs: desktop top, mobile bottom */
.tabs{

}
.bottom-nav{
  display:flex;

.bottom-nav button{

  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;border-radius:12px;min-width:0;
}
.bottom-nav button .ico{font-size:18px;line-height:1}
.bottom-nav button.active{color:var(--accent);background:rgba(95,168,255,.1)}
.bottom-nav button:active{transform:scale(.96)}

.btn,.select,.input{
  min-height:44px;font-size:15px;border-radius:12px;
}
.btn{padding:10px 14px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.table{font-size:12px;min-width:520px}
.table th,.table td{padding:10px 8px;white-space:nowrap}
.hero{padding:16px;border-radius:16px}
.heroValue{font-size:28px}
.grid{grid-template-columns:1fr 1fr;gap:8px}
.two{grid-template-columns:1fr;gap:12px}
.chart{height:240px}
.modal{align-items:flex-end;padding:0}
.modalbox{
  width:100%;max-width:100%;border-radius:20px 20px 0 0;
  max-height:92dvh;overflow:auto;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0));
}
.modalfoot{position:sticky;bottom:0;background:var(--panel);padding-top:10px;gap:8px}
.modalfoot .btn{flex:1;min-height:48px}
.card{border-radius:16px;padding:14px}
.stat{padding:12px}
.stat .v{font-size:16px}
.notice{font-size:12px;padding:8px 12px;margin:8px 0}

/* more room on larger phones / tablets */
@media (min-width:720px){
  .app{padding:16px 16px 24px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;position:static}
  .bottom-nav{display:none}
  .actions{width:auto}
  .actions .btn{flex:initial}
  .two{grid-template-columns:1.2fr .8fr}
  .grid{grid-template-columns:repeat(4,1fr)}
  .modal{align-items:center;padding:18px}
  .modalbox{max-width:480px;border-radius:18px;max-height:90vh}
  .chart{height:300px}
  .top{position:static;background:transparent;backdrop-filter:none;border:0;margin:0;padding:0}
}

/* install banner */
.install-bar{
  display:none;position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0));
  z-index:35;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow);align-items:center;gap:10px;
}
.install-bar.show{display:flex}
.install-bar p{margin:0;flex:1;font-size:13px;color:var(--muted)}
.install-bar b{color:var(--text);display:block;margin-bottom:2px}

'use strict';

// --- Автоматическая регистрация встроенного Service Worker (для работы PWA) ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', (e) => self.skipWaiting());
      self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', (e) => {
        // Офлайн фоллбэк при отсутствии сети
        e.respondWith(
          fetch(e.request).catch(() => caches.match(e.request))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(err => console.warn('SW registration failed:', err));
  });
}

const KEY = 'vfinal45_terminal_v12';
const PREV_KEYS = ['vfinal45_terminal_v4', 'vfinal45_terminal_v3', 'vfinal45_terminal_v2', 'vfinal45_terminal_v1', 'vfinal42_terminal_v4', 'vfinal42_terminal_v3', 'vfinal44_terminal_v1'];

/* ---- безопасное хранилище (localStorage может быть запрещён в превью) ---- */
let memStore = null;
let storageMode = 'memory'; // 'local' | 'memory'

function canUseLocalStorage() {
  try {
    const k = '__t_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

function storageGet(key) {
  if (storageMode === 'local') {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  return memStore && memStore.key === key ? memStore.value : null;
}

function storageSet(key, value) {
  if (storageMode === 'local') {
    try { window.localStorage.setItem(key, value); return true; } catch (e) { /* fallthrough */ }
  }
  memStore = { key, value };
  storageMode = 'memory';
  return false;
}

storageMode = canUseLocalStorage() ? 'local' : 'memory';

function migrate(x) {
  x.settings = x.settings || {};
  x.history = Array.isArray(x.history) ? x.history : [];
  x.ops = Array.isArray(x.ops) ? x.ops : [];
  x.dividends = Array.isArray(x.dividends) ? x.dividends : [];

  x.planned = Array.isArray(x.planned) ? x.planned : [];
  (x.dividends || []).forEach((d, i) => { if (!d.id) d.id = 'd' + i + '_' + (d.date || '') + '_' + (d.asset || ''); });
  (x.ops || []).forEach((o, i) => { if (!o.id) o.id = 'o' + i + '_' + (o.date || '') + '_' + i; });
  x.assets = Array.isArray(x.assets) ? x.assets : [];
  if (!Number.isFinite(x.settings.dayBaseValue)) x.settings.dayBaseValue = totalOf(x);
  if (!x.settings.dayBaseDate) x.settings.dayBaseDate = new Date().toISOString().slice(0, 10);
  if (typeof x.settings.brokerAdjustment !== 'number') x.settings.brokerAdjustment = 0;
  if (typeof x.settings.baseAdjustment !== 'number') {
    x.settings.baseAdjustment = Number.isFinite(x.settings.brokerAdjustment) ? x.settings.brokerAdjustment : 3.71;
  }
  (x.dividends || []).forEach(d => {
    if (d.seed == null && String(d.id || '').startsWith('seed_')) { d.seed = true; d.cashApplied = false; }
  });
  (x.assets || []).forEach(a => {
    if (a.type === 'ОФЗ' && !a.secid) a.secid = OFZ_MAP[a.ticker] || a.ticker;
  });
  if (!x.history.length) {
    x.history.push({ date: '2026-04-01', value: 240000, invested: 240000 });
  } else if (x.history[0] && Number(x.history[0].value) !== 240000 && x.history[0].date <= '2026-04-01') {
    x.history[0].value = 240000;
    x.history[0].invested = x.history[0].invested || 240000;
  }
  // дивиденды со скрина Т-Инвест: восстановить, если пусто или неполный набор
  const needDivs = !x.dividends.length
    || x.dividends.length < SEED_DIVIDENDS.length
    || Math.abs(x.dividends.reduce((s, d) => s + (Number(d.amount) || 0), 0) - 16010.78) > 50;
  if (needDivs && x.dividends.length <= SEED_DIVIDENDS.length + 2) {
    // сохранить пользовательские сверх seed

    const extra = x.dividends.filter(d => !seedAssets.has(d.asset) || !SEED_DIVIDENDS.some(s => s.asset === d.asset && Math.abs(s.amount - d.amount) < 0.01));
    x.dividends = clone(SEED_DIVIDENDS).concat(extra);
  }
  if (!Array.isArray(x.planned)) {
    x.planned = clone(seed.planned || []);
  }
  // убрать из плана уже прошедшие (должны быть только в дивидендах)
  const today = new Date().toISOString().slice(0, 10);

    const d = p.payDate || p.nextDate || '';
    return !d || d >= today;
  });
  if (!x.version || x.version < 6) x.version = 6;
}

function fmt(x) {

function assetValue(a) { return (Number(a.qty) || 0) * (Number(a.price) || 0); }
function assetInvested(a) { return (Number(a.qty) || 0) * (Number(a.avg) || 0); }
/** P&L позиции = (цена − средняя) × qty */
function assetPnl(a) {
  const q = Number(a.qty) || 0;
  return q * ((Number(a.price) || 0) - (Number(a.avg) || 0));
}

function growthFromFirst() {

  if (!rows.length) return { abs: 0, pct: 0, first: 0, date: '—' };

}

function ensureDayBase() {

/**
 * Дневное P&L позиции.
 * Акции: (цена − prev) × qty  или  CHANGE × qty (CHANGE в ₽).
 * Облигации: цена в ₽ = % от номинала × 10 (ном. 1000).
 *   CHANGE по ОФЗ — в процентных пунктах → Δ₽ = CHANGE × 10 × qty.
 */
function assetDayPnl(a) {
  const q = a.qty || 0;
  if (!q) return 0;
  // приоритет: явное дневное изменение с биржи
  if (a.dayPnl != null && Number.isFinite(a.dayPnl)) return a.dayPnl;
  if (isBond(a)) {
    // CHANGE в п.п. номинала
    if (a.marketChange != null && Number.isFinite(a.marketChange) && a.marketChange !== 0) {
      const nom = a.nominal || 1000;
      return a.marketChange / 100 * nom * q;
    }
  } else {
    if (a.marketChange != null && Number.isFinite(a.marketChange) && a.marketChange !== 0) {
      return a.marketChange * q;
    }
  }
  const prev = (a.prevClose > 0) ? a.prevClose : (a.prevPrice > 0 ? a.prevPrice : null);
  if (prev == null) return 0;
  return ((a.price || 0) - prev) * q;
}
/** Портфельное дневное: сумма по активам с prevClose; fallback — база дня */
function dayChange() {
  ensureDayBase();
  const fromQuotes = db.assets
    .filter(a => !a.archived && ((a.prevClose > 0) || (a.prevPrice > 0)))
    .reduce((s, a) => s + assetDayPnl(a), 0);
  const hasQuotes = db.assets.some(a => !a.archived && ((a.prevClose > 0) || (a.prevPrice > 0)));
  if (hasQuotes) return fromQuotes;
  const base = Number(db.settings.dayBaseValue) || 0;
  const today = new Date().toISOString().slice(0, 10);
  const cash = (db.ops || [])
    .filter(o => o.date === today && (o.type === 'Пополнение' || o.type === 'Вывод'))
    .reduce((s, o) => s + (o.type === 'Пополнение' ? 1 : -1) * (Number(o.amount) || 0), 0);
  return total() - base - cash;
}
function dayChangePct() {
  if (!db.settings) return 0;
  const hasQuotes = db.assets.some(a => !a.archived && ((a.prevClose > 0) || (a.prevPrice > 0)));
  if (hasQuotes) {
    const prevTot = db.assets.filter(a => !a.archived).reduce((s, a) => {
      const prev = a.prevClose > 0 ? a.prevClose : (a.prevPrice > 0 ? a.prevPrice : a.price);
      return s + (a.qty || 0) * (prev || 0);
    }, 0);
    return prevTot ? dayChange() / prevTot * 100 : 0;
  }
  const base = Number(db.settings.dayBaseValue) || 0;
  return base ? dayChange() / base * 100 : 0;
}
/** Парсинг числа: 1 234,56 или 1234.56 */
function parseNum(v) {
  if (typeof v === 'number') return v;
  const s = String(v ?? '').trim().replace(/\s/g, '').replace(',', '.');
  const n = parseFloat(s);

/* ========== IMPROVED CHART ========== */
function buildChartRows(range) {
  let rows = [...(db.history || [])]
    .filter(r => r && r.date)
    .sort((a, b) => a.date.localeCompare(b.date));

  // убрать дубликаты дат — оставить последнее
  const byDate = new Map();
  rows.forEach(r => byDate.set(r.date, r));
  rows = [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date));

  rows = rows.map(r => {
    const deposits = r.deposits != null
      ? Number(r.deposits)
      : cumulativeDepositsUntil(r.date);
    const dividends = cumulativeDivsUntil(r.date);
    return {
      date: r.date,
      value: Number(r.value) || 0,
      invested: Number(r.invested) || 0,
      deposits: Math.max(0, deposits),
      dividends: Math.max(0, dividends)
    };
  });

  const today = new Date().toISOString().slice(0, 10);
  const live = {
    date: today,
    value: total(),
    invested: invested(),
    deposits: Math.max(0, cumulativeDepositsUntil(today)),
    dividends: Math.max(0, cumulativeDivsUntil(today))
  };
  if (rows.length && rows[rows.length - 1].date === today) {
    rows[rows.length - 1] = live;
  } else {
    rows.push(live);
  }

  if (range && range !== 'all') {
    const n = +range;
    if (n > 0) rows = rows.slice(-Math.max(2, n));
  }
  return rows;
}

function drawChart() {
  const c = el('canvas');
  if (!c) return;
  const tip = el('chartTip');
  const meta = el('chartMeta');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const range = (el('chartRange') && el('chartRange').value) || 'all';
  const scaleMode = (el('chartScale') && el('chartScale').value) || 'fit';
  const showDep = false;
  const showDiv = el('chartArea') ? el('chartArea').checked : true;

  const rows = buildChartRows(range);
  const w = Math.max(c.clientWidth || 800, 280);
  const h = Math.max(c.clientHeight || 320, 260);
  c.width = Math.floor(w * dpr);
  c.height = Math.floor(h * dpr);
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (rows.length < 2) {
    ctx.fillStyle = '#8fa1b5';
    ctx.font = '13px system-ui,sans-serif';
    ctx.fillText('Недостаточно точек истории', 20, 36);
    return;
  }

  const padL = 58, padR = showDiv ? 52 : 16, padT = 16, padB = 34;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  // Левая ось: капитал + пополнения (крупные суммы)
  const leftVals = rows.flatMap(r => {
    const v = [r.value];
    if (showDep) v.push(r.deposits);
    return v;
  });
  let maxL = Math.max(...leftVals, 1);
  let minL = Math.min(...leftVals);
  if (scaleMode === 'zero') {
    minL = 0;
    maxL = maxL * 1.06;
  } else if (scaleMode === 'tight') {
    const sp = maxL - minL || 1;
    maxL += sp * 0.04;
    minL = Math.max(0, minL - sp * 0.04);
  } else {
    const sp = maxL - minL || 1;
    maxL += sp * 0.1;
    minL = Math.max(0, minL - sp * 0.05);
  }
  if (maxL <= minL) maxL = minL + 1;

  // Правая ось: дивиденды (меньший масштаб)
  const divVals = rows.map(r => r.dividends);
  let maxR = Math.max(...divVals, 1);
  let minR = 0;
  maxR = maxR * 1.15;

  const X = i => padL + (rows.length <= 1 ? plotW / 2 : i * plotW / (rows.length - 1));
  const YL = v => padT + (maxL - v) / (maxL - minL) * plotH;
  const YR = v => padT + (maxR - v) / (maxR - minR) * plotH;

  // сетка по левой оси
  ctx.strokeStyle = 'rgba(38,53,72,.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = minL + (maxL - minL) * (i / 4);
    const y = YL(v);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.fillStyle = '#8fa1b5';
    ctx.font = '10px system-ui,sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(compactRub(v), padL - 6, y + 3);
  }
  // подписи правой оси
  if (showDiv) {
    ctx.fillStyle = '#3dd68c';
    ctx.textAlign = 'left';
    for (let i = 0; i <= 4; i++) {
      const v = minR + (maxR - minR) * (i / 4);
      const y = YR(v);
      ctx.fillText(compactRub(v), w - padR + 6, y + 3);
    }
  }

  // заливка капитала
  ctx.beginPath();
  rows.forEach((r, i) => {
    const x = X(i), y = YL(r.value);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.lineTo(X(rows.length - 1), padT + plotH);
  ctx.lineTo(X(0), padT + plotH);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, padT, 0, padT + plotH);
  g.addColorStop(0, 'rgba(95,168,255,.18)');
  g.addColorStop(1, 'rgba(95,168,255,0)');
  ctx.fillStyle = g;
  ctx.fill();

  function line(getY, color, width, dash) {
    ctx.beginPath();
    ctx.setLineDash(dash || []);
    rows.forEach((r, i) => {
      const x = X(i), y = getY(r);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (showDep) line(r => YL(r.deposits), '#f0b429', 2, [5, 4]);
  if (showDiv) line(r => YR(r.dividends), '#3dd68c', 2.4, []);
  line(r => YL(r.value), '#5fa8ff', 2.6, []);

  // точки капитала
  rows.forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(X(i), YL(r.value), 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#5fa8ff';
    ctx.fill();
    ctx.strokeStyle = '#0b121a';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  });

  // даты
  ctx.fillStyle = '#8fa1b5';
  ctx.font = '10px system-ui,sans-serif';
  ctx.textAlign = 'center';
  const step = rows.length > 8 ? Math.ceil(rows.length / 6) : 1;
  rows.forEach((r, i) => {
    if (i % step === 0 || i === rows.length - 1) {
      ctx.fillText(r.date.slice(5), X(i), h - 10);
    }
  });

  const first = rows[0], last = rows[rows.length - 1];
  const dVal = last.value - first.value;
  const dPct = first.value ? dVal / first.value * 100 : 0;
  if (meta) {
    meta.textContent = first.date.slice(5) + '→' + last.date.slice(5) +
      ' · ' + signed(dVal, fmt) + ' (' + signed(dPct, pf) + ')' +
      ' · дивы ' + fmt(last.dividends);
  }

  function tipAt(best) {
    if (!tip) return;
    const r = rows[best];
    const delta = r.value - r.deposits;
    tip.style.display = 'block';
    tip.style.left = Math.min(w - 190, Math.max(6, X(best) + 8)) + 'px';
    tip.style.top = Math.max(6, YL(r.value) - 88) + 'px';
    tip.innerHTML = '<b>' + r.date + '</b><br>' +
      'Капитал: ' + fmt(r.value) + '<br>' +
      'Пополнения: ' + fmt(r.deposits) + '<br>' +
      'Дивиденды: ' + fmt(r.dividends) + '<br>' +
      '<span class="' + (delta >= 0 ? 'good' : 'bad') + '">К вложениям: ' + signed(delta, fmt) + '</span>';
  }

  c.onmousemove = ev => {
    const rect = c.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) * (w / rect.width);
    let best = 0, bd = Infinity;
    rows.forEach((_, i) => {
      const d = Math.abs(X(i) - mx);
      if (d < bd) { bd = d; best = i; }
    });
    if (bd > 50) { tip.style.display = 'none'; return; }
    tipAt(best);
  };
  c.onmouseleave = () => { if (tip) tip.style.display = 'none'; };
}

function compactRub(v) {
  const n = Number(v) || 0;
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + ' млн';
  if (Math.abs(n) >= 1e3) return Math.round(n / 1e3) + ' тыс';
  return String(Math.round(n));
}

/** Применить операцию к позициям и кэшу */

/** Базовый кэш (остаток на счёте без учёта журнала пользователя) */
function baseCash() {
  const b = Number(db.settings && db.settings.baseAdjustment);
  return Number.isFinite(b) ? b : 3.71;
}

/**
 * Полный пересчёт свободного кэша из журнала + дивидендов (не seed).
 * Вызывать после любого add/delete операции или дивиденда.
 */
function recomputeCash() {
  if (!db.settings) db.settings = {};
  let cash = baseCash();
  (db.ops || []).forEach(o => {
    const a = Number(o.amount) || 0;
    const t = o.type;
    if (t === 'Пополнение') cash += a;
    else if (t === 'Вывод') cash -= a;
    else if (t === 'Покупка') cash -= a;
    else if (t === 'Продажа') cash += a;
    else if (t === 'Дивиденд' || t === 'Купон') cash += a;
    else if (t === 'Комиссия') cash -= Math.abs(a);
  });
  (db.dividends || []).forEach(d => {
    if (d.fromOp) return;          // уже учтено в ops
    if (d.seed || d.cashApplied === false) return; // исторические seed
    cash += Number(d.amount) || 0;
  });
  db.settings.brokerAdjustment = cash;
  return cash;
}

/** Изменение qty/avg по операции (без кэша — кэш через recomputeCash) */
function applyOpPositions(o, sign) {
  if (!o) return;
  const s = sign >= 0 ? 1 : -1;
  const a = o.assetId
    ? db.assets.find(x => x.id === o.assetId)
    : (o.ticker ? db.assets.find(x => x.ticker === o.ticker) : null);
  const qty = Number(o.qty) || 0;
  const amount = Number(o.amount) || 0;
  const t = o.type;
  if (!a || qty <= 0) return;

  if (t === 'Покупка') {
    if (s > 0) {
      const cost = (a.qty || 0) * (a.avg || 0);
      a.qty = (a.qty || 0) + qty;
      a.avg = a.qty ? (cost + amount) / a.qty : (a.avg || o.price || 0);
    } else {
      a.qty = Math.max(0, (a.qty || 0) - qty);
    }
  } else if (t === 'Продажа') {
    if (s > 0) a.qty = Math.max(0, (a.qty || 0) - qty);
    else a.qty = (a.qty || 0) + qty;
  }
}

function applyOp(o, sign) {
  if (!o) return;
  const s = sign >= 0 ? 1 : -1;
  const amount = Number(o.amount) || 0;
  const t = o.type;
  applyOpPositions(o, sign);

  if ((t === 'Дивиденд' || t === 'Купон') && amount) {
    if (s > 0) {
      if (!Array.isArray(db.dividends)) db.dividends = [];
      const divId = o.divId || uid('d');
      o.divId = divId;
      if (!db.dividends.some(d => d.id === divId || d.fromOp === o.id)) {
        const a = o.assetId ? db.assets.find(x => x.id === o.assetId) : null;
        db.dividends.push({
          id: divId,
          date: o.date,
          asset: a ? a.ticker : (o.ticker || '—'),
          type: t,
          amount,
          note: o.note || 'из журнала',
          fromOp: o.id,
          cashApplied: true
        });
      }
    } else {
      db.dividends = (db.dividends || []).filter(d => d.fromOp !== o.id && d.id !== o.divId);
    }
  }
  recomputeCash();
}

function removeOpById(id, idx) {
  if (!Array.isArray(db.ops)) db.ops = [];
  ensureOpIds();
  let i = db.ops.findIndex(o => o && String(o.id) === String(id));
  if (i < 0 && idx != null && idx >= 0 && idx < db.ops.length) i = +idx;
  if (i < 0) return false;
  const o = db.ops[i];
  db.ops.splice(i, 1);
  try { applyOpPositions(o, -1); } catch (e) { console.warn(e); }
  try {
    if (o && (o.type === 'Дивиденд' || o.type === 'Купон')) {
      db.dividends = (db.dividends || []).filter(d => d.fromOp !== o.id && d.id !== o.divId);
    }
  } catch (e) { console.warn(e); }
  try { recomputeCash(); } catch (e) { console.warn(e); }
  try { autoSnapshot(); } catch (e) { console.warn(e); }
  try { save(); } catch (e) { console.warn(e); }
  return true;
}

function ensureOpIds() {
  if (!Array.isArray(db.ops)) db.ops = [];
  db.ops.forEach((o, i) => {
    if (!o.id) o.id = 'o_auto_' + i + '_' + (o.date || '') + '_' + (o.type || '');
  });
}

/** Сохранить текущие цены в график и на диск */
function persistState() {
  try { recomputeCash(); } catch (e) { console.warn('recomputeCash', e); }
  try { autoSnapshot(); } catch (e) { console.warn('autoSnapshot', e); }
  try { save(); } catch (e) { console.warn('save', e); }
}

/** Утверждённые выплаты: сумма, попадающая в календарный период по payDate */
function inPeriod(payDate, period) {
  if (!payDate) return false;
  const d = new Date(payDate + 'T12:00:00');
  if (isNaN(d)) return false;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  if (period === 'month') return d.getFullYear() === y && d.getMonth() === m;
  if (period === 'quarter') {
    const q = Math.floor(m / 3), dq = Math.floor(d.getMonth() / 3);
    return d.getFullYear() === y && dq === q;
  }
  if (period === 'year') return d.getFullYear() === y;
  // next12: от сегодня + 365 дней
  if (period === 'next12') {
    const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const t1 = new Date(t0); t1.setDate(t1.getDate() + 365);
    return d >= t0 && d <= t1;
  }
  return false;
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

/** Утверждённые и ещё не полученные (дата выплаты >= сегодня) */
function approvedPlanned() {
  const today = todayISO();
  return (db.planned || []).filter(p => {
    if ((p.status || 'approved') !== 'approved') return false;
    if (p.received) return false;
    const d = p.payDate || p.nextDate || '';
    return d >= today; // будущие и сегодня — ещё к получению
  });
}

function planSum(period) {
  return approvedPlanned()
    .filter(p => inPeriod(p.payDate || p.nextDate, period))
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
}

/* ========== MOEX QUOTES ========== */
function isBond(a) {
  return a.type === 'ОФЗ' || a.type === 'Корп. облигация';
}
function resolveSecid(a) {
  return a.secid || OFZ_MAP[a.ticker] || a.ticker;
}

async function fetchJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function quote(a) {
  const secid = resolveSecid(a);
  const candidates = isBond(a)
    ? [
        { market: 'bonds', board: 'TQOB' },
        { market: 'bonds', board: 'TQCB' }
      ]
    : [
        { market: 'shares', board: 'TQBR' },
        { market: 'shares', board: 'TQTF' },
        { market: 'shares', board: 'TQIF' }
      ];

  for (const { market, board } of candidates) {
    try {
      const url = `https://iss.moex.com/iss/engines/stock/markets/${market}/boards/${board}/securities/${encodeURIComponent(secid)}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,PREVPRICE,CLOSEPRICE,LCURRENTPRICE,CHANGE`;
      const j = await fetchJson(url);
      const md = j.marketdata;
      if (!md?.data?.length) continue;
      const idx = Object.fromEntries(md.columns.map((c, i) => [c, i]));
      const row = md.data.find(x => x[idx.SECID] === secid) || md.data[0];
      let last = Number(row[idx.LAST]);
      if (!Number.isFinite(last) || last <= 0) {
        last = Number(row[idx.LCURRENTPRICE] ?? row[idx.CLOSEPRICE]);
      }
      if (!Number.isFinite(last) || last <= 0) continue;

      const change = Number(row[idx.CHANGE]);
      const prevRaw = Number(row[idx.PREVPRICE]);
      const nom = a.nominal || 1000;

      let newPrice, prevClose;
      if (isBond(a)) {
        // MOEX: LAST/PREVPRICE в % от номинала (обычно 50–150).
        // Если значение уже > 200 — считаем, что это рубли за штуку.
        const toRub = (x) => (x > 0 && x < 200) ? (x / 100 * nom) : x;
        newPrice = toRub(last);
        prevClose = Number.isFinite(prevRaw) && prevRaw > 0 ? toRub(prevRaw) : null;
        a.marketChange = Number.isFinite(change) ? change : 0; // п.п.
        // дневной P&L в ₽: Δ% × номинал × qty
        if (Number.isFinite(change)) {
          a.dayPnl = change / 100 * nom * (a.qty || 0);
        } else if (prevClose != null) {
          a.dayPnl = (newPrice - prevClose) * (a.qty || 0);
        }
      } else {
        newPrice = last;
        prevClose = Number.isFinite(prevRaw) && prevRaw > 0 ? prevRaw : null;
        a.marketChange = Number.isFinite(change) ? change : 0; // ₽
        if (Number.isFinite(change)) {
          a.dayPnl = change * (a.qty || 0);
        } else if (prevClose != null) {
          a.dayPnl = (newPrice - prevClose) * (a.qty || 0);
        }
      }

      if (prevClose != null) {
        a.prevClose = prevClose;
        a.prevPrice = prevClose;
      } else if (a.price > 0 && Math.abs(a.price - newPrice) > 1e-9) {
        if (!a.prevClose) a.prevClose = a.price;
        if (!a.prevPrice) a.prevPrice = a.price;
      }
      a.price = newPrice;
      return true;
    } catch (e) {}
  }
  return false;
}

async function refresh(silent) {
  if (refreshing) return { ok: 0, total: 0 };
  refreshing = true;
  try {
    if (!silent) {
      const nt = el('noticeText');
      if (nt) nt.innerHTML = '<span class="spinner"></span>Обновляю котировки MOEX…';
    }
    ensureDayBase();
    const list = db.assets.filter(a => a.online !== false && !a.archived);
    const results = await Promise.all(
      list.map(a => quote(a).then(ok => ok).catch(() => false))
    );
    const ok = results.filter(Boolean).length;
    db.lastUpdate = new Date().toISOString();
    // авто-точка графика на сегодня
    autoSnapshot();
    save();
    const d = dayChange();
    if (!silent) {
      setNotice('Обновлено ' + ok + ' из ' + list.length + '. День: ' + signed(d, fmt) + ' · ' + signed(dayChangePct(), pf));
    }
    render();
    return { ok, total: list.length };
  } finally {
    refreshing = false;
  }
}

function autoSnapshot() {
  if (!Array.isArray(db.history)) db.history = [];
  if (!db.history.length) {
    db.history.push({ date: '2026-04-01', value: 240000, invested: 240000, deposits: 240000, dividends: 0 });
  }
  const today = new Date().toISOString().slice(0, 10);
  const point = {
    date: today,
    value: total(),
    invested: invested(),
    deposits: cumulativeDepositsUntil(today),
    dividends: cumulativeDivsUntil(today)
  };
  const last = db.history[db.history.length - 1];
  if (last && last.date === today) {
    Object.assign(last, point);
  } else {
    db.history.push(point);
  }
}

/** Накопленные чистые пополнения до даты включительно */
function cumulativeDepositsUntil(date) {
  let sum = 0;
  // стартовый капитал из первой точки истории
  const first = (db.history || [])[0];
  if (first && first.date <= date) {
    sum = Number(first.deposits != null ? first.deposits : first.invested) || 0;
  }
  (db.ops || []).forEach(o => {
    if (!o.date || o.date > date) return;
    if (o.type === 'Пополнение') sum += Number(o.amount) || 0;
    if (o.type === 'Вывод') sum -= Number(o.amount) || 0;
  });
  return sum;
}

/** Накопленные полученные дивиденды до даты */
function cumulativeDivsUntil(date) {
  return (db.dividends || []).reduce((s, d) => {
    if (!d.date || d.date > date) return s;
    return s + (Number(d.amount) || 0);
  }, 0);
}



function snapshot() {
  if (!db.settings) db.settings = {};
  if (!Array.isArray(db.history)) db.history = [];
  // если истории пуста — первая точка 240к уже должна быть; иначе добавляем текущую
  if (!db.history.length) {
    db.history.push({ date: '2026-04-01', value: 240000, invested: 240000 });
  }
  const today = new Date().toISOString().slice(0, 10);
  const last = db.history[db.history.length - 1];
  if (last && last.date === today) {
    last.value = total();
    last.invested = invested();
  } else {
    db.history.push({ date: today, value: total(), invested: invested() });
  }
  save();
  render();
  setNotice('Точка графика сохранена (' + today + ') · капитал ' + fmt(total()));
}

function doExport() {
  try {
    persistState();
    const json = JSON.stringify(db, null, 2);
    const name = 'invest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    // способ 1: <a download>
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { a.remove(); URL.revokeObjectURL(u); } catch (e) {} }, 2000);
    setNotice('Бэкап: ' + name + ' · ' + Math.round(json.length / 1024) + ' КБ');
  } catch (err) {
    console.error(err);
    // fallback: окно с JSON для копирования
    try {
      const json = JSON.stringify(db, null, 2);
      const w = window.open('', '_blank', 'width=640,height=480');
      if (w) {
        w.document.write('<pre style="white-space:pre-wrap;font:12px monospace"></pre>');
        w.document.querySelector('pre').textContent = json;
        w.document.title = 'Бэкап JSON — сохраните как .json';
      } else {
        prompt('Скопируйте бэкап (Ctrl+C):', json.slice(0, 2000));
      }
      setNotice('Бэкап открыт в окне — сохраните файл вручную');
    } catch (e2) {
      alert('Ошибка бэкапа: ' + (err.message || err));
    }
  }
}

function applyImportedDb(x, label) {
  if (!x || typeof x !== 'object') throw new Error('Не JSON-объект');
  if (!Array.isArray(x.assets)) throw new Error('В файле нет assets[]');
  migrate(x);
  db = x;
  if (!db.settings) db.settings = {};
  if (typeof db.settings.baseAdjustment !== 'number') {
    db.settings.baseAdjustment = Number(db.settings.brokerAdjustment) || 3.71;
  }
  try { recomputeCash(); } catch (e) {}
  try { autoSnapshot(); } catch (e) {}
  save();
  render();
  setNotice('Загружено: ' + (label || 'бэкап') + ' · активов: ' + db.assets.length);
}

function doImportFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onerror = () => alert('Не удалось прочитать файл');
  r.onload = () => {
    try {
      const x = JSON.parse(String(r.result || ''));
      applyImportedDb(x, file.name);
    } catch (err) {
      console.error(err);
      alert('Ошибка загрузки: ' + (err.message || err));
    }
  };
  r.readAsText(file, 'utf-8');
}

function doImportPick() {
  let fi = document.getElementById('fileInput');
  if (!fi) {
    fi = document.createElement('input');
    fi.type = 'file';
    fi.accept = 'application/json,.json,text/json,text/plain';
    fi.id = 'fileInput';
    fi.hidden = true;
    document.body.appendChild(fi);
    fi.addEventListener('change', function (e) {
      const f = e.target.files && e.target.files[0];
      if (f) doImportFile(f);
      e.target.value = '';
    });
  }
  fi.value = '';
  fi.click();
}


document.addEventListener('click', function (e) {
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    e.preventDefault();
    const act = actBtn.getAttribute('data-act');
    try {
      if (act === 'refresh') refresh();
      else if (act === 'snapshot') snapshot();
      else if (act === 'daybase') doDayBase();
      else if (act === 'addOp') opModal();
      else if (act === 'addDiv') divModal();
      else if (act === 'addPlan') planModal();
      else if (act === 'addAsset') assetModal();
      else if (act === 'goAnalytics') { tab = 'analytics'; render(); }
    } catch (err) {
      console.error(err);
      setNotice('Ошибка: ' + (err.message || err));
      alert('Ошибка: ' + (err.message || err));
    }
    return;
  }

  const tabBtn = e.target.closest('.tab, #bottomNav [data-tab]');
  if (tabBtn && tabBtn.dataset.tab) {
    e.preventDefault();
    const t = tabBtn.dataset.tab;
    if (t === 'more') { showMoreMenu(); return; }
    tab = t;
    try { render(); } catch (err) {
      console.error(err);
      setNotice('Ошибка вкладки: ' + (err.message || err));
    }
    return;
  }

  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    e.preventDefault();
    const a = db.assets.find(x => x.id === editBtn.getAttribute('data-edit'));
    if (a) assetModal(a);
    return;
  }

  const delAsset = e.target.closest('[data-delete]');
  if (delAsset) {
    e.preventDefault();
    deleteAsset(delAsset.getAttribute('data-delete'));
    return;
  }

  const delOp = e.target.closest('[data-op-del]');
  if (delOp) {
    e.preventDefault();
    e.stopPropagation();
    try {
      if (!window.confirm('Удалить операцию из журнала?')) return;
      const id = delOp.getAttribute('data-op-del');
      const idx = parseInt(delOp.getAttribute('data-op-i'), 10);
      const before = total();
      const ok = removeOpById(id, idx);
      if (!ok) {
        window.alert('Операция не найдена');
        return;
      }
      tab = 'ops';
      render();
      setNotice('Удалено · ' + fmt(before) + ' → ' + fmt(total()));
    } catch (err) {
      console.error(err);
      window.alert('Ошибка удаления: ' + (err.message || err));
    }
    return;
  }

  const divEdit = e.target.closest('[data-div-edit]');
  if (divEdit) {
    e.preventDefault();
    try {
      const id = divEdit.getAttribute('data-div-edit');
      const item = (db.dividends || []).find(d => String(d.id) === String(id));
      if (item) divModal(item);
    } catch (err) { console.error(err); }
    return;
  }

  const divDel = e.target.closest('[data-div-del]');
  if (divDel) {
    e.preventDefault();
    e.stopPropagation();
    try {
      if (!window.confirm('Удалить выплату?')) return;
      const id = divDel.getAttribute('data-div-del');
      const before = divTotal();
      const n = (db.dividends || []).length;
      db.dividends = (db.dividends || []).filter(d => String(d.id) !== String(id));
      if (db.dividends.length === n) {
        // fallback by index
        const di = parseInt(divDel.getAttribute('data-div-i'), 10);
        if (!isNaN(di) && di >= 0) {
          const sorted = [...(db.dividends || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          const item = sorted[di];
          if (item) db.dividends = db.dividends.filter(d => d !== item);
        }
      }
      persistState();
      tab = 'divs';
      render();
      setNotice('Удалено · выплат: ' + fmt(before) + ' → ' + fmt(divTotal()));
    } catch (err) {
      console.error(err);
      window.alert('Ошибка удаления: ' + (err.message || err));
    }
    return;
  }

  const planEdit = e.target.closest('[data-plan-edit]');
  if (planEdit) {
    e.preventDefault();
    const id = planEdit.getAttribute('data-plan-edit');
    const item = (db.planned || []).find(d => d.id === id);
    if (item) planModal(item);
    return;
  }

  const planRecv = e.target.closest('[data-plan-recv]');
  if (planRecv) {
    e.preventDefault();
    const id = planRecv.getAttribute('data-plan-recv');
    const item = (db.planned || []).find(d => d.id === id);
    if (!item) return;
    if (!confirm('Отметить как полученное? Сумма попадёт в «Дивиденды» и в капитал.')) return;
    if (!db.settings) db.settings = {};
    if (!Array.isArray(db.dividends)) db.dividends = [];
    const amount = Number(item.amount) || 0;
    db.dividends.push({
      id: uid('d'),
      date: item.payDate || item.nextDate || todayISO(),
      asset: item.ticker,
      type: item.type || 'Дивиденд',
      amount,
      note: (item.note || '') + ' (из плана)',
      cashApplied: true
    });
    db.planned = db.planned.filter(d => d.id !== id);
    persistState();
    tab = 'divs';
    render();
    setNotice('Получено ' + fmt(amount) + ' · в дивидендах: ' + fmt(divTotal()) + ' · капитал: ' + fmt(total()));
    return;
  }

  const planDel = e.target.closest('[data-plan-del]');
  if (planDel) {
    e.preventDefault();
    if (!confirm('Удалить из плана?')) return;
    const id = planDel.getAttribute('data-plan-del');
    db.planned = (db.planned || []).filter(d => d.id !== id);
    save();
    tab = 'plan';
    render();
    setNotice('Удалено из плана');
    return;
  }
});

  const modeMsg = storageMode === 'local'
    ? 'Данные сохраняются в браузере.'
    : 'Внимание: localStorage недоступен (превью) — данные только в памяти, скачайте бэкап.';
  setNotice(modeMsg + ' Загружаю котировки…');
  // авто: котировки + день + точка графика
  refresh(true).then(r => {
    const d = dayChange();
    setNotice(
      modeMsg +
      ' Обновлено ' + (r && r.ok != null ? r.ok : 0) +
      ' котировок. День: ' + signed(d, fmt) + ' · ' + signed(dayChangePct(), pf) +
      '. Точка графика на сегодня записана.'
    );
    render();
  }).catch(err => {
    console.error(err);
    autoSnapshot();
    save();
    setNotice(modeMsg + ' Котировки недоступны (офлайн/CORS). Демо-данные. ' + (err.message || ''));
    render();
  });
} catch (err) {
  console.error(err);
  const n = document.getElementById('noticeText');
  if (n) n.textContent = 'Ошибка старта: ' + (err.message || err);
}

/* PWA install */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const bar = document.getElementById('installBar');
  if (bar && !window.matchMedia('(display-mode: standalone)').matches) {
    bar.classList.add('show');
  }
});
document.getElementById('installBtn')?.addEventListener('click', async () => {
  if (!deferredPrompt) {
    alert('В Chrome: меню ⋮ → «Установить приложение».\nВ Safari iPhone: Поделиться → На экран «Домой».');
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBar')?.classList.remove('show');
});
document.getElementById('installClose')?.addEventListener('click', () => {
  document.getElementById('installBar')?.classList.remove('show');
});

// deep link hash
if (location.hash) {
  const h = location.hash.slice(1);
  if (['dashboard','assets','ops','divs','plan','fund','reserve','analytics','system'].includes(h)) {
    tab = h;
  }
}

</script>
